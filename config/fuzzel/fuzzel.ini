include=~/.config/fuzzel/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=11:weight=medium
dpi-aware=no
prompt="󰍉  "
placeholder="Launch application..."
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,keywords,categories
fuzzy=yes
show-actions=no
terminal=kitty -e
launch-prefix=
lines=10
width=42
tabs=4
horizontal-pad=20
vertical-pad=14
inner-pad=10
image-size-ratio=0.4
line-height=24
layer=overlay
exit-on-keyboard-focus-loss=yes

[border]
width=2
radius=14

[dmenu]
exit-immediately-if-empty=no
