# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #
# wallust configuration - for wallust version 3.0 (Wayle Port)

backend = "fastresize"
color_space = "labmixed"
palette = "dark16"
threshold = 11

[templates]
cava.template = 'colors-cava'
cava.target = '~/.config/cava/config'

hypr.template = 'colors-hyprland.conf'
hypr.target = '~/.config/hypr/wallust/wallust-hyprland.conf'

rofi.template = 'colors-rofi.rasi'
rofi.target = '~/.config/hypr/rofi/wallust/colors-rofi.rasi'

waybar.template = 'colors-waybar.css'
waybar.target = '~/.config/hypr/waybar/wallust/colors-waybar.css'

wayle_toml.template = 'colors-wayle.toml'
wayle_toml.target = '~/.config/wayle/themes/Wallust-Dynamic.toml'

wayle_scss.template = 'colors-wayle.scss'
wayle_scss.target = '~/.config/wayle/styles/_wallust-colors.scss'

kitty.template = 'colors-kitty.conf'
kitty.target = '~/.config/kitty/themes/wallust.conf'

ghostty.template = 'colors-ghostty.conf'
ghostty.target = '~/.config/ghostty/wallust.conf'

quickshell.template = 'qml_color.json'
quickshell.target = '~/.config/quickshell/qml_color.json'

nwg-dock.template = 'colors-nwg-dock.css'
nwg-dock.target = '~/.config/nwg-dock-hyprland/wallust/colors-wallust.css'

swaync.template = 'colors-swaync.css'
swaync.target = '~/.config/swaync/wallust/colors-wallust.css'
