[accessibility]
ui_scale = 1.20

[bar.default]
start = [ "launcher", "spacer_1", "workspaces", "spacer_1", "active_window" ]
center = [ "clock" ]
end = [ "media", "spacer_1", "group:hw", "group:netvol", "tray", "notifications", "session" ]
concave_edge_corners = false
margin_edge = 8
margin_ends = 16
radius_top_left = 18
radius_top_right = 18
radius_bottom_left = 18
radius_bottom_right = 18
scale = 1.05
thickness = 36
border = "#7aa2f7"
border_width = 2.0
background_opacity = 0.92

    [[bar.default.capsule_group]]
    border = "#f7768e"
    fill = "on_secondary"
    id = "hw"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 0.95
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "#7dcfff"
    fill = "on_secondary"
    id = "netvol"
    members = [ "network", "volume" ]
    opacity = 0.95
    padding = 6.0

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
corner_radius_scale = 0.85
card_borders = true
button_borders = true
input_borders = true
popup_borders = true
popup_shadows = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    list_item_background = true
    borders = true
    shadow = true

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[control_center]
sidebar = "compact"
width = 720
show_session_button = true
show_shortcut_labels = true

    [control_center.calendar]
    show_events_card = true
    show_week_numbers = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "community"
community_palette = "Tokyo Night Moon"
pure_black_dark = false

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "#7dcfff"
format = "{:%H:%M  %a %d}"

[widget.launcher]
color = "#bb9af7"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "#7aa2f7"
show_label = true

[widget.notifications]
color = "#f7768e"

[widget.session]
color = "#f7768e"

[widget.spacer_1]
type = "spacer"

[widget.temp]
color = "#e0af68"
show_value = true

[widget.sysmon_2]
color = "#7aa2f7"
glyph = "gpu-usage"
show_value = true
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
color = "#9ece6a"
glyph = "cpu-2"
show_value = true
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "#7dcfff"
show_label = true

[widget.workspaces]
active_pill_size = 2.4
capsule = true
capsule_fill = "on_primary"
change_color_on_hover = false
empty_color = "#24283b"
focused_color = "#bb9af7"
inactive_pill_size = 1.2
occupied_color = "#7aa2f7"
pill_scale = 1.0
show_icons = true
show_labels = true

[wallpaper]
directory = "/home/viniciusphdu/dotfiles/wallpapers"
