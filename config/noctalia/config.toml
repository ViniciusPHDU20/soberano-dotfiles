[accessibility]
ui_scale = 1.20

[bar.default]
background_opacity = 0.0
border = "#bd93f9"
border_width = 2.0
start = [ "launcher", "spacer_1", "workspaces", "spacer_1", "active_window" ]
center = [ "clock" ]
end = [ "media", "spacer_1", "group:hw", "group:netvol", "tray", "notifications", "session" ]
concave_edge_corners = false
margin_edge = 8
margin_ends = 16
radius_top_left = 18
radius_top_right = 18
radius_bottom_left = 18
radius_bottom_right = 18
scale = 1.05
thickness = 36

[[bar.default.capsule_group]]
    border = "#ff79c6"
    fill = "on_secondary"
    id = "hw"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 0.95
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "#50fa7b"
    fill = "on_secondary"
    id = "netvol"
    members = [ "network", "volume", "raycursive/discord-voice:bar" ]
    opacity = 0.95
    padding = 6.0

[shell]
corner_radius_scale = 1.4
card_borders = true
button_borders = true
input_borders = true
popup_borders = true
popup_shadows = true

    [shell.panel]
    transparency_mode = "soft"
    control_center_placement = "floating"
    control_center_position = "center"
    open_near_click_control_center = false
    list_item_background = true
    borders = true
    shadow = true
    floating_offset = 16

[control_center]
sidebar = "compact"
width = 680
show_session_button = true
show_shortcut_labels = true

    [control_center.calendar]
    show_events_card = true
    show_week_numbers = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "community"
community_palette = "Aura"
pure_black_dark = false

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "#ff79c6"
format = "{:%a %d | %H:%M}"

[widget.launcher]
color = "#bd93f9"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "#8be9fd"
show_label = true

[widget.notifications]
color = "#ff79c6"

[widget.session]
color = "#ff5555"

[widget.spacer_1]
type = "spacer"

[widget.temp]
color = "#ffb86c"
show_value = true

[widget.sysmon_2]
color = "#8be9fd"
glyph = "gpu-usage"
show_value = true
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
color = "#50fa7b"
glyph = "cpu-2"
show_value = true
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "#50fa7b"
show_label = true

[widget.workspaces]
active_pill_size = 2.2
capsule = true
capsule_fill = "on_primary"
change_color_on_hover = false
empty_color = "#44475a"
focused_color = "#bd93f9"
inactive_pill_size = 1.2
occupied_color = "#8be9fd"
pill_scale = 1.0
show_icons = true
show_labels = true

[wallpaper]
directory = "/home/viniciusphdu/dotfiles/wallpapers"

[plugins]
enabled = [ "raycursive/discord-voice" ]

[plugin_settings."raycursive/discord-voice"]
discord_binary = "/usr/bin/vesktop"

[widget."raycursive/discord-voice:bar"]
show_channel_name = true
hide_when_disconnected = false
