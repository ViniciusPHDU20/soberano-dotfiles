# ==============================================================================
# JaKooLit Hyprland-Dots Layout Port: BOT-&-Left-SouthWest
# ==============================================================================
[bar]
location = "bottom"
inset-edge = 0.25
inset-ends = 0.45
padding = 0.35
padding-ends = 0.55
module-gap = 0.45

[[bar.layout]]
monitor = "*"
show = true
left = [
    { module = "custom-hypr-layout", class = "mod-layout" },
    { module = "dashboard", class = "mod-menu" },
    { module = "cpu", class = "mod-cpu" },
    { module = "ram", class = "mod-memory" },
    { module = "storage", class = "mod-disk" },
    { module = "custom-lock", class = "mod-lock" },
    { module = "idle-inhibit", class = "mod-idle" },
]
center = [
    { module = "keybind-mode", class = "mod-submap" },
    "hyprland-workspaces",
    { module = "clock", class = "mod-clock" },
]
right = [
    { module = "weather", class = "mod-weather" },
    { module = "battery", class = "mod-battery" },
    { module = "brightness", class = "mod-backlight" },
    { module = "volume", class = "mod-volume" },
    { module = "microphone", class = "mod-mic" },
    { module = "keyboard-input", class = "mod-keyboard" },
    { module = "hyprsunset", class = "mod-nightlight" },
    { module = "power", class = "mod-power" },
    { module = "media", class = "mod-media" },
    { name = "notify", modules = [{ module = "notifications", class = "mod-notify" }, { module = "custom-updater", class = "mod-updater" }] },
    "systray",
    { module = "custom-light-dark", class = "mod-theme" },
]
