# ==============================================================================
# JaKooLit Hyprland-Dots Layout Port: TOP-ddubs-simple-bar
# ==============================================================================
[bar]
location = "top"
inset-edge = 0.25
inset-ends = 0.45
padding = 0.35
padding-ends = 0.55
module-gap = 0.45

[[bar.layout]]
monitor = "*"
show = true
left = [
    { module = "custom-hypr-layout", class = "mod-layout" },
    "cava",
    { module = "media", class = "mod-media" },
    { module = "window-title", class = "mod-window" },
]
center = [
    { module = "keybind-mode", class = "mod-submap" },
    { module = "notifications", class = "mod-notify" },
    "hyprland-workspaces",
    { module = "clock", class = "mod-clock" },
    { module = "idle-inhibit", class = "mod-idle" },
]
right = [
    { module = "volume", class = "mod-volume" },
    { module = "microphone", class = "mod-mic" },
    "systray",
    { module = "weather", class = "mod-weather" },
    { module = "cpu", class = "mod-cpu" },
    { module = "ram", class = "mod-memory" },
    { module = "battery", class = "mod-battery" },
    { name = "status", modules = [{ module = "keyboard-input", class = "mod-keyboard" }, { module = "custom-lock", class = "mod-lock" }, { module = "power", class = "mod-power" }] },
]
