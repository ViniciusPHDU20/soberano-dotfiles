# ==============================================================================
# JaKooLit Hyprland-Dots Layout Port: TOP-&-BOT-SummitSplit-v2
# ==============================================================================
[bar]
location = "top"
inset-edge = 0.55
inset-ends = 0.85
padding = 0.35
padding-ends = 0.55
module-gap = 0.85

[[bar.layout]]
monitor = "*"
show = true
left = [
    { module = "custom-hypr-layout", class = "mod-layout" },
    { name = "app-drawer", modules = [{ module = "dashboard", class = "mod-menu" }, { module = "custom-files", class = "mod-files" }, { module = "custom-tty", class = "mod-tty" }, { module = "custom-browser", class = "mod-browser" }, { module = "custom-settings", class = "mod-settings" }] },
    { module = "keyboard-input", class = "mod-keyboard" },
    { module = "clock", class = "mod-clock" },
    { module = "bluetooth", class = "mod-bluetooth" },
    { module = "network", class = "mod-network" },
    "hyprland-workspaces",
]
center = [
    { module = "keybind-mode", class = "mod-submap" },
    { module = "window-title", class = "mod-window" },
]
right = [
    { module = "media", class = "mod-media" },
    { module = "battery", class = "mod-battery" },
    { module = "brightness", class = "mod-backlight" },
    { module = "volume", class = "mod-volume" },
    { name = "mobo", modules = [{ module = "cpu", class = "mod-cpu" }, { module = "ram", class = "mod-memory" }, { module = "storage", class = "mod-disk" }] },
    { module = "idle-inhibit", class = "mod-idle" },
    { module = "hyprsunset", class = "mod-nightlight" },
    { name = "power-group", modules = [{ module = "custom-lock", class = "mod-lock" }, { module = "power", class = "mod-power" }] },
    "systray",
    { module = "custom-updater", class = "mod-updater" },
    { name = "notify", modules = [{ module = "notifications", class = "mod-notify" }, { module = "custom-updater", class = "mod-updater" }] },
]
