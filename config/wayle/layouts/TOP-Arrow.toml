# ==============================================================================
# JaKooLit Hyprland-Dots Layout Port: TOP-Arrow
# ==============================================================================
[bar]
location = "top"
inset-edge = 0.25
inset-ends = 0.45
padding = 0.35
padding-ends = 0.55
module-gap = 0.45

[[bar.layout]]
monitor = "*"
show = true
left = [
    { module = "custom-hypr-layout", class = "mod-layout" },
    "hyprland-workspaces",
    { module = "window-title", class = "mod-window" },
]
center = [
    { module = "keybind-mode", class = "mod-submap" },
]
right = [
    { module = "volume", class = "mod-volume" },
    { module = "network", class = "mod-network" },
    { module = "ram", class = "mod-memory" },
    { module = "cpu", class = "mod-cpu" },
    { module = "battery", class = "mod-battery" },
    "systray",
    { module = "hyprsunset", class = "mod-nightlight" },
    { module = "clock", class = "mod-clock" },
]
