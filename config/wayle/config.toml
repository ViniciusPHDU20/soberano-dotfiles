[general]
tearing-mode = false

[bar]
scale = 1.0
location = "top"
exclusive = true
inset-edge = 6.0
inset-ends = 10.0
padding = 4.0
padding-ends = 8.0
module-gap = 6.0
bg = "bg-base"
background-opacity = 85
border-location = "all"
border-width = 1
border-color = "border-subtle"
rounding = "full"
shadow = true
button-variant = "basic"
button-opacity = 90
button-bg-opacity = 70
button-icon-size = 1.0
button-icon-padding = 1.0
button-label-size = 0.95
button-label-weight = "medium"
button-label-padding = 1.5
button-rounding = "full"
button-gap = 1.0
button-group-padding = 2.0
button-group-module-gap = 4.0
button-group-background = "bg-surface-elevated"
button-group-opacity = 65
button-group-rounding = "full"
button-group-border-location = "none"
dropdown-shadow = true
dropdown-opacity = 95
dropdown-autohide = true

[[bar.layout]]
monitor = "*"
show = true
left = ["dashboard", "hyprland-workspaces", "window-title"]
center = ["clock", "media", "cava"]
right = [
    { name = "hardware", modules = ["cpu", "ram", "storage"] },
    "weather",
    "volume",
    "microphone",
    "network",
    "systray",
    "notifications"
]

[styling]
scale = 1.0
rounding = "lg"
theme-provider = "matugen"
theming-monitor = "DP-1"
matugen-scheme = "tonal-spot"
matugen-contrast = 0.0
matugen-source-color = 0
matugen-light = false

[styling.palette]
bg = "#111318"
surface = "#1d2026"
elevated = "#282a31"
fg = "#e2e2e9"
fg-muted = "#c4c6d0"
primary = "#aac7ff"
red = "#ffb4ab"
yellow = "#e0c46c"
green = "#8cd5b0"
blue = "#aac7ff"

[wallpaper]
engine-enabled = true
transition-type = "grow"
transition-duration = 0.7
transition-fps = 144
cycling-enabled = false
cycling-directory = "/home/viniciusphdu/dotfiles/wallpapers"
cycling-mode = "shuffle"
cycling-interval-mins = 30

[[wallpaper.monitors]]
name = "DP-1"
wallpaper = "/home/viniciusphdu/dotfiles/wallpapers/Anime-City-Night.png"
fit-mode = "fill"

[osd]
enabled = true
position = "bottom"
duration = 2000
monitor = "primary"
margin = 100.0
border = true

[modules.dashboard]
icon-override = "󰣇"
border-show = false
icon-color = "accent"
icon-bg-color = "bg-surface-elevated"
dropdown-lock-command = "loginctl lock-session"
dropdown-logout-command = "hyprctl dispatch exit"
dropdown-reboot-command = "systemctl reboot"
dropdown-poweroff-command = "systemctl poweroff"

[modules.hyprland-workspaces]
min-workspace-count = 5
monitor-specific = true
show-special = false
numbering = "absolute"
display-mode = "label"
urgent-show = true

[modules.window-title]
format = "{{ title }}"
label-max-length = 45
icon-show = true

[modules.clock]
format = "%H:%M  •  %a %d %b"
icon-show = true
dropdown-show-seconds = true

[modules.media]
format = "{{ title }} - {{ artist }}"
label-max-length = 35
icon-show = true

[modules.cava]
bars = 14
framerate = 60
style = "bars"
bar-width = 3
bar-gap = 2
low-cutoff = 50
high-cutoff = 10000
color = "accent"

[modules.cpu]
format = "{{ percent }}%"
poll-interval-ms = 3000

[modules.ram]
format = "{{ percent }}%"
poll-interval-ms = 5000

[modules.storage]
mount-point = "/"
format = "{{ percent }}%"
poll-interval-ms = 30000

[modules.weather]
provider = "open-meteo"
location = "Sao Paulo"
units = "metric"
format = "{{ temp }}{{ temp_unit }}"
time-format = "24h"
refresh-interval-seconds = 1800

[modules.volume]
format = "{{ percent }}%"

[modules.microphone]
icon-show = true
label-show = false

[modules.network]
icon-show = true
label-show = false

[modules.notifications]
icon-show = true
label-show = true
popup-position = "top-right"
popup-duration = 4500
popup-shadow = true
