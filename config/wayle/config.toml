[general]
tearing-mode = false

[bar]
scale = 0.95
location = "top"
exclusive = true
inset-edge = 0.35
inset-ends = 0.5
padding = 0.3
padding-ends = 0.5
module-gap = 0.4
bg = "bg-surface"
background-opacity = 88
border-location = "all"
border-width = 1
border-color = "border-subtle"
rounding = "lg"
button-variant = "block-prefix"
button-opacity = 100
button-bg-opacity = 90
button-icon-size = 0.95
button-icon-padding = 0.85
button-label-size = 0.92
button-label-weight = "semibold"
button-label-padding = 0.85
button-rounding = "sm"
button-gap = 0.75
button-border-location = "all"
button-border-width = 1
button-group-padding = 0.15
button-group-module-gap = 0.25
button-group-background = "bg-elevated"
button-group-opacity = 92
button-group-rounding = "sm"
button-group-border-location = "none"
dropdown-shadow = true
dropdown-opacity = 96
dropdown-autohide = true

shadow = "none"
button-group-border-color = "border-accent"
[[bar.layout]]
monitor = "*"
show = true
left = ["dashboard", "hyprland-workspaces", "window-title"]
center = ["clock", "media", "cava"]
right = [
    { name = "hardware", modules = ["custom-cpu", "custom-ram", "custom-storage"] },
    "weather",
    "volume",
    "microphone",
    "network",
    "custom-updates",
    "systray",
    "notifications"
]
[styling]
scale = 1.0
rounding = "md"
theme-provider = "matugen"
theming-monitor = "DP-1"
matugen-scheme = "tonal-spot"
matugen-contrast = -0.45
matugen-source-color = 0
matugen-light = false

[styling.palette]
bg = "#111318"
surface = "#1d2026"
elevated = "#282a31"
fg = "#e2e2e9"
fg-muted = "#c4c6d0"
primary = "#aac7ff"
red = "#ffb4ab"
yellow = "#e0c46c"
green = "#8cd5b0"
blue = "#aac7ff"

[wallpaper]
engine-enabled = true
transition-type = "grow"
transition-duration = 0.7
transition-fps = 144
cycling-enabled = false
cycling-directory = "/home/viniciusphdu/dotfiles/wallpapers"
cycling-mode = "shuffle"
cycling-interval-mins = 30

[[wallpaper.monitors]]
name = "DP-1"
wallpaper = "/home/viniciusphdu/dotfiles/wallpapers/Lofi - Chill Room.png"
fit-mode = "fill"

[osd]
enabled = true
position = "bottom"
duration = 2000
monitor = "primary"
margin = 120.0
border = true

[modules.dashboard]
icon-override = "cm-beastie-symbolic"
border-show = false
icon-color = "auto"
icon-bg-color = "accent"
dropdown-lock-command = "loginctl lock-session"
dropdown-logout-command = "hyprctl dispatch exit"
dropdown-reboot-command = "systemctl reboot"
dropdown-poweroff-command = "systemctl poweroff"

[modules.hyprland-workspaces]
min-workspace-count = 5
monitor-specific = true
show-special = false
numbering = "absolute"
display-mode = "label"
urgent-show = true
app-icons-show = true

[modules.window-title]
format = "{{ title }}"
label-max-length = 40
icon-show = true

[modules.clock]
format = "%H:%M  •  %a %d %b"
icon-show = true
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
dropdown-show-seconds = true

[modules.media]
format = "{{ title }} - {{ artist }}"
label-max-length = 30
icon-show = true
icon-color = "auto"
icon-bg-color = "accent"
label-color = "fg-default"

[modules.cava]
bars = 12
framerate = 60
style = "bars"
bar-width = 3
bar-gap = 2
low-cutoff = 50
high-cutoff = 10000
color = "accent"

[modules.cpu]
format = "{{ percent }}%"
poll-interval-ms = 3000
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
left-click = "kitty --class float_monitor -e btop"

[modules.ram]
format = "{{ percent }}%"
poll-interval-ms = 5000
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
left-click = "kitty --class float_monitor -e btop"

[modules.storage]
mount-point = "/"
format = "{{ percent }}%"
poll-interval-ms = 30000
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
left-click = "kitty --class float_monitor -e btop"

[modules.weather]
provider = "open-meteo"
location = "Sao Paulo"
units = "metric"
format = "{{ temp }}{{ temp_unit }}"
time-format = "24h"
refresh-interval-seconds = 1800
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"

[modules.volume]
format = "{{ percent }}%"
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"

[modules.microphone]
icon-show = true
label-show = false
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"

[modules.network]
icon-show = true
label-show = false
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"

[modules.notifications]
icon-show = true
label-show = true
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
popup-position = "top-right"
popup-duration = 4500
popup-shadow = true

[modules.systray]
icon-scale = 0.9
item-gap = 0.25
internal-padding = 0.3
border-show = false

[[modules.custom]]
id = "updates"
command = "bash -c '$HOME/dotfiles/scripts/soberano-check-updates.sh'"
interval-ms = 300000
icon-name = "ld-refresh-cw-symbolic"
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
tooltip-format = "{{ tooltip }}"
left-click = "bash -c '$HOME/dotfiles/scripts/soberano-update.sh'"

[[modules.custom]]
id = "cpu"
command = "bash -c '$HOME/dotfiles/scripts/hardware-hud.sh cpu'"
interval-ms = 3000
format = "{{ percent }}%"
icon-name = "ld-cpu-symbolic"
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
left-click = "bash -c 'python3 $HOME/dotfiles/scripts/soberano-hardware-menu.py'"

[[modules.custom]]
id = "ram"
command = "bash -c '$HOME/dotfiles/scripts/hardware-hud.sh ram'"
interval-ms = 5000
format = "{{ percent }}%"
icon-name = "ld-memory-stick-symbolic"
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
left-click = "bash -c 'python3 $HOME/dotfiles/scripts/soberano-hardware-menu.py'"

[[modules.custom]]
id = "storage"
command = "bash -c '$HOME/dotfiles/scripts/hardware-hud.sh storage'"
interval-ms = 30000
format = "{{ percent }}%"
icon-name = "ld-hard-drive-symbolic"
icon-color = "auto"
icon-bg-color = "accent"
label-color = "accent"
left-click = "bash -c 'python3 $HOME/dotfiles/scripts/soberano-hardware-menu.py'"


