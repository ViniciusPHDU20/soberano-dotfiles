# ==============================================================================
# JaKooLit Style & Theme Preset: Extra-Crimson
# ==============================================================================
scss = "extra-crimson"

[palette]
bg = "#140c10"
surface = "#1f1117"
elevated = "#2d1822"
fg = "#f5e0e5"
fg-muted = "#b88c98"
primary = "#ff3366"
red = "#ff3366"
yellow = "#ff9966"
green = "#e06c75"
blue = "#d16d9e"

[bar_style]
theme-provider = "wayle"
bg = "transparent"
background-opacity = 0
border-location = "none"
border-width = 0
border-color = "border-accent"
rounding = "none"
shadow = "none"
button-variant = "basic"
button-opacity = 100
button-bg-opacity = 90
button-rounding = "full"
button-border-location = "all"
button-border-width = 1
button-group-border-location = "none"
button-group-border-width = 0
button-group-padding = 0.2
button-group-module-gap = 0.35
button-group-background = "bg-surface"
button-group-opacity = 0
button-group-border-color = "border-accent"
button-group-rounding = "full"
workspace-indicator = "background"
