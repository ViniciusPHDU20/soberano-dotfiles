# ==============================================================================
# JaKooLit Style & Theme Preset: Catppuccin-Latte
# ==============================================================================
scss = "catppuccin-latte"

[palette]
bg = "#eff1f5"
surface = "#e6e9ef"
elevated = "#ccd0da"
fg = "#4c4f69"
fg-muted = "#6c6f85"
primary = "#8839ef"
red = "#d20f39"
yellow = "#df8e1d"
green = "#40a02b"
blue = "#1e66f5"

[bar_style]
theme-provider = "wayle"
bg = "transparent"
background-opacity = 0
border-location = "none"
border-width = 0
border-color = "border-accent"
rounding = "none"
shadow = "none"
button-variant = "block-prefix"
button-opacity = 100
button-bg-opacity = 95
button-rounding = "full"
button-border-location = "all"
button-border-width = 1
button-group-border-location = "all"
button-group-border-width = 1
button-group-padding = 0.25
button-group-module-gap = 0.35
button-group-background = "bg-surface"
button-group-opacity = 90
button-group-border-color = "border-accent"
button-group-rounding = "full"
workspace-indicator = "background"
