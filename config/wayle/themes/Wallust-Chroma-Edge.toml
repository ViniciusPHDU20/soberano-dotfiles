# ==============================================================================
# JaKooLit Style & Theme Preset: Wallust-Chroma-Edge
# ==============================================================================
scss = "wallust-chroma-edge"

[palette]
bg = "#0d0e17"
surface = "#141626"
elevated = "#1f233b"
fg = "#e2e8f0"
fg-muted = "#94a3b8"
primary = "#00eeff"
red = "#ff2a85"
yellow = "#ffe600"
green = "#00ff9d"
blue = "#bd00ff"

[bar_style]
theme-provider = "wallust"
bg = "transparent"
background-opacity = 0
border-location = "none"
border-width = 0
border-color = "border-accent"
rounding = "none"
shadow = "none"
button-variant = "basic"
button-opacity = 100
button-bg-opacity = 85
button-rounding = "full"
button-border-location = "all"
button-border-width = 2
button-group-border-location = "all"
button-group-border-width = 2
button-group-padding = 0.25
button-group-module-gap = 0.35
button-group-background = "bg-base"
button-group-opacity = 85
button-group-border-color = "border-accent"
button-group-rounding = "full"
workspace-indicator = "background"
