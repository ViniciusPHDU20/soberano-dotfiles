# ==============================================================================
# JaKooLit Style & Theme Preset: Wallust-ML4W-modern
# ==============================================================================
scss = "wallust-ml4w-modern"

[palette]
bg = "#111622"
surface = "#192030"
elevated = "#242e44"
fg = "#f0f4fc"
fg-muted = "#9cb0d4"
primary = "#68b0ff"
red = "#ff6b8b"
yellow = "#ffd166"
green = "#06d6a0"
blue = "#4cc9f0"

[bar_style]
theme-provider = "wallust"
bg = "transparent"
background-opacity = 0
border-location = "none"
border-width = 0
border-color = "border-accent"
rounding = "none"
shadow = "none"
button-variant = "icon-square"
button-opacity = 100
button-bg-opacity = 92
button-rounding = "full"
button-border-location = "all"
button-border-width = 1
button-group-border-location = "all"
button-group-border-width = 1
button-group-padding = 0.3
button-group-module-gap = 0.35
button-group-background = "bg-surface"
button-group-opacity = 92
button-group-border-color = "border-accent"
button-group-rounding = "full"
workspace-indicator = "background"
