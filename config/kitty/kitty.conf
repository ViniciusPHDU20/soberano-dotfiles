# ==============================================================================
# Soberano Kitty Configuration (Matugen Material Design 3)
# ==============================================================================

font_family                 JetBrainsMono Nerd Font
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   11.0

background_opacity          0.78
dynamic_background_opacity  yes
cursor_shape                beam
cursor_trail                1
window_padding_width        18
confirm_os_window_close     0
enable_audio_bell           no
repaint_delay               7
input_delay                 1
sync_to_monitor             yes

include themes/matugen.conf
